name: SEO validation and IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "assets/**"
      - "sitemap.xml"
      - "robots.txt"
      - "CNAME"
      - "*.txt"
      - ".github/workflows/seo-indexnow.yml"
      - ".github/scripts/seo_indexnow.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: seo-indexnow
  cancel-in-progress: true

jobs:
  validate-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate site and submit changed URLs
        env:
          GH_TOKEN: ${{ github.token }}
          INDEXNOW_KEY: a4b908d3e7f14c5a95d2c8f061b3e74a
        run: python3 .github/scripts/seo_indexnow.py
